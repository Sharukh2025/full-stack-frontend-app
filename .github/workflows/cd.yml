name: Frontend CD (Vercel)

on:
  workflow_dispatch:  # manual deploy only

jobs:
  frontend-cd:
    name: Continuous Delivery
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy application
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          BRANCH="${GITHUB_REF##*/}"
          echo "Deploying branch: $BRANCH"

          # Skip development branch
          if [ "$BRANCH" = "development" ]; then
            echo "Skipping deployment for development branch."
            exit 0
          fi

          # Deploy production or staging
          if [ "$BRANCH" = "production" ]; then
            echo "Production deployment"
            vercel --prod --confirm --token=$VERCEL_TOKEN
          else
            echo "Preview deployment"
            vercel --confirm --token=$VERCEL_TOKEN
