name: CI-CD Manual Trigger

on:
  workflow_dispatch:

jobs:
  ci:
    name: Build & Test (CI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build app
        run: CI=false npm run build

      - name: Run tests
        run:   CI=false npm test -- --watch=false --passWithNoTests

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/

  cd:
    name: Deploy to Vercel (CD)
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build
          path: build/

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy based on branch
        run: |
          if [ "${GITHUB_REF##*/}" == "production" ]; then
            echo "Deploying to Production..."
            vercel --prod --confirm
          elif [ "${GITHUB_REF##*/}" == "staging" ]; then
            echo "Deploying to Staging..."
            vercel --confirm --env=STAGING
          elif [ "${GITHUB_REF##*/}" == "development" ]; then
            echo "Deploying to Development..."
            vercel --confirm --env=DEVELOPMENT
          else
            echo "Branch does not match any environment. Skipping deploy."
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
