name: CD - Manual Deployment

on:
  workflow_dispatch:

jobs:
  ci:
    name: Build & Test (CI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: npm install
      - run: CI=false npm run build
      - run: npm test

   cd:
    name: Deploy to Vercel (Production)
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: npm install
      - run: CI=false npm run build
      - run: |
          if [ "${GITHUB_REF##*/}" == "production" ]; then
            echo "Deploying to Production..."
            vercel --prod --confirm
          elif [ "${GITHUB_REF##*/}" == "staging" ]; then
            echo "Deploying to Staging..."
            vercel --confirm --env=STAGING
          elif [ "${GITHUB_REF##*/}" == "development" ]; then
            echo "Deploying to Development..."
            vercel --confirm --env=DEVELOPMENT
          else
            echo "Branch does not match any environment. Skipping deploy."
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
