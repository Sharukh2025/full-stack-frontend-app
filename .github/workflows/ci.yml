name: Frontend CI

on:
  push:
    branches:
      - production
      - staging
      - development
  pull_request:
    branches:
      - production
      - staging
      - development
  workflow_dispatch:  # optional: manual CI trigger

jobs:
  frontend-ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test -- --watch=false --passWithNoTests

      - name: Validate production build
        run: CI=false npm run build
